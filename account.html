<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Account | Apex Draft Suite</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .shell.narrow { width: min(760px, 92%); padding: 56px 0; }
  .field { margin: 8px 0; color: var(--muted); }
  .field b { color: var(--ink); }
  .tier-badge {
    display: inline-block; padding: 6px 14px; border-radius: 999px; font-weight: 700;
    font-size: .82rem; letter-spacing: .02em; margin-bottom: 12px; font-family: 'IBM Plex Mono', monospace;
  }
  .tier-combine { background: rgba(255,255,255,.08); color: var(--muted); }
  .tier-draft_weekend_pass { background: rgba(255,138,61,.16); color: var(--accent); }
  .tier-war_room { background: rgba(52,211,153,.14); color: var(--buy); }
  .tier-front_office { background: rgba(255,138,61,.22); color: var(--accent); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .mini-card { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); padding: 18px; }
  .mini-card h3 { color: var(--ink); font-size: .85rem; letter-spacing: .05em; text-transform: uppercase; margin: 0 0 8px; }
  .mini-card p { margin: 0; color: var(--muted); font-size: .9rem; }
  .mini-card.locked { opacity: .5; }
  .signout {
    background: none; border: 1px solid var(--border-2); color: var(--ink); padding: 9px 16px;
    border-radius: 999px; font-family: inherit; cursor: pointer; font-size: .85rem;
  }
  .upsell-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  #loading { color: var(--muted); }
  @media (max-width: 850px) { .grid-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="shell narrow">
  <p class="eyebrow" style="justify-content:flex-start;"><span style="width:16px;height:1px;background:var(--accent);display:inline-block;margin-right:8px;"></span>Apex Draft Suite</p>
  <h1 style="font-size:clamp(1.9rem, 5vw, 2.6rem); margin:0 0 8px;">My Account</h1>
  <p class="sub" id="loading" style="color:var(--muted); margin:0 0 28px;">Checking your session...</p>
  <div id="content" style="display:none;"></div>
</div>

<script>
const supabaseClient = supabase.createClient(
  "https://eeinccayoscirvyifwul.supabase.co",
  "sb_publishable_EJWPZYQaku9kNdTBqkpL2Q_Kk1hpUkk"
);

const TIER_LABELS = {
  combine: "The Combine (Free)",
  draft_weekend_pass: "Draft Weekend Pass",
  war_room: "War Room",
  front_office: "Front Office",
};

// Ordering used only to decide what to show/lock below — not written back anywhere.
const TIER_RANK = { combine: 0, draft_weekend_pass: 1, war_room: 2, front_office: 3 };

function renderSignedOut() {
  document.getElementById("loading").style.display = "none";
  const content = document.getElementById("content");
  content.style.display = "block";
  content.innerHTML = `
    <div class="panel" style="border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:28px;">
      <p class="field">You're not signed in.</p>
      <a class="btn btn-primary" style="display:inline-block;margin-top:10px;" href="/login.html">Sign in</a>
    </div>
  `;
}

function renderError(message) {
  document.getElementById("loading").style.display = "none";
  const content = document.getElementById("content");
  content.style.display = "block";
  content.innerHTML = `<div class="panel" style="border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:28px;"><div class="notice" style="border-left:3px solid var(--fade);background:rgba(251,100,116,.08);color:#f2c9c0;padding:14px 16px;border-radius:0 8px 8px 0;">${message}</div></div>`;
}

async function renderAccount(session, row) {
  document.getElementById("loading").style.display = "none";
  const content = document.getElementById("content");
  content.style.display = "block";

  // A purchase makes a subscribers row; no row yet just means free/Combine —
  // not an error state.
  const tier = row ? row.tier : "combine";
  const status = row ? row.status : "active";

  // expires_at (Draft Weekend Pass only) isn't flipped server-side today — see
  // Build Log. Checked client-side here so an expired pass reads as expired
  // even though the DB row's status field hasn't caught up yet.
  const expired = row && row.expires_at && new Date(row.expires_at) < new Date();
  const effectiveTier = (status !== "active" || expired) ? "combine" : tier;
  const rank = TIER_RANK[effectiveTier];

  const lock = (minTier) => (TIER_RANK[minTier] > rank ? " locked" : "");
  const lockNote = (minTier) => (TIER_RANK[minTier] > rank
    ? `<p style="margin-top:8px;"><a href="#upsell" style="color:var(--accent);">Requires ${TIER_LABELS[minTier]} &rarr;</a></p>` : "");

  let statusNote = "";
  if (row && expired) {
    statusNote = `<div class="notice" style="border-left:3px solid var(--accent);background:rgba(255,138,61,.07);color:var(--muted);padding:14px 16px;border-radius:0 8px 8px 0;margin-top:10px;">Your Draft Weekend Pass expired ${new Date(row.expires_at).toLocaleString()}. You're back on The Combine (free) tier.</div>`;
  } else if (row && status === "refunded") {
    statusNote = `<div class="notice" style="border-left:3px solid var(--fade);background:rgba(251,100,116,.08);color:#f2c9c0;padding:14px 16px;border-radius:0 8px 8px 0;margin-top:10px;">This purchase was refunded — access reflects The Combine (free) tier.</div>`;
  }

  content.innerHTML = `
    <div class="panel" style="border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:28px;margin-bottom:18px;">
      <span class="tier-badge tier-${effectiveTier}">${TIER_LABELS[effectiveTier]}</span>
      <p class="field"><b>Signed in as:</b> ${session.user.email}</p>
      ${row && row.expires_at && !expired ? `<p class="field"><b>Pass expires:</b> ${new Date(row.expires_at).toLocaleString()}</p>` : ""}
      ${statusNote}
      <button class="signout" id="signOutBtn" style="margin-top:14px;">Sign out</button>
    </div>

    <div class="grid-2">
      <div class="mini-card${lock('combine')}">
        <h3>Scout Reports (lite)</h3>
        <p>The Edge intro + three validated demo reports.</p>
        <a class="btn btn-ghost btn-sm" style="margin-top:10px;" href="/index.html#lookup">Open</a>
      </div>
      <div class="mini-card${lock('war_room')}">
        <h3>Full Scout Reports + The Edge</h3>
        <p>The complete 234-player TrueVolume pool.</p>
        ${lockNote('war_room')}
      </div>
      <div class="mini-card${lock('draft_weekend_pass')}">
        <h3>DraftPulse (live draft assistant)</h3>
        <p>Real-time Scout Report alerts during your Sleeper draft.</p>
        ${rank >= TIER_RANK.draft_weekend_pass
          ? '<a class="btn btn-primary btn-sm" style="margin-top:10px;" href="/draftpulse.html">Launch DraftPulse</a>'
          : lockNote('draft_weekend_pass')}
      </div>
      <div class="mini-card${lock('front_office')}">
        <h3>Custom League Algorithms + Guides</h3>
        <p>Front Office differentiator — in build, not live yet.</p>
        ${rank >= TIER_RANK.front_office
          ? '<p style="margin-top:8px;color:var(--muted);">Coming soon for your tier.</p>'
          : lockNote('front_office')}
      </div>
    </div>

    ${rank < TIER_RANK.front_office ? `
    <div class="panel" id="upsell" style="border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:28px;margin-top:18px;">
      <p class="field"><b>Upgrade</b></p>
      <div class="upsell-row">
        ${rank < TIER_RANK.war_room ? '<a class="btn btn-primary" href="https://apex-draft-suite.kit.com/products/war-roomseason-pass" target="_blank" rel="noopener">War Room ($29.99)</a>' : ''}
        ${rank < TIER_RANK.draft_weekend_pass ? '<a class="btn btn-ghost" href="https://apex-draft-suite.kit.com/products/draftweekend-pass-48-hours" target="_blank" rel="noopener">Draft Weekend Pass ($9.99 / 48h)</a>' : ''}
        <a class="btn btn-ghost" href="https://apex-draft-suite.kit.com/products/front-officeseason-pass" target="_blank" rel="noopener">Front Office ($49.99)</a>
      </div>
      <p style="margin-top:10px;color:var(--muted);font-size:.85rem;">Purchases usually unlock within a minute or two. If it's been longer, <a href="mailto:admin@apexdraftsuite.com" style="color:var(--accent);">let us know</a>.</p>
    </div>` : ""}
  `;

  document.getElementById("signOutBtn").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    window.location.href = "/login.html";
  });
}

async function init() {
  const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

  if (sessionError) {
    renderError("Couldn't check your session: " + sessionError.message);
    return;
  }

  if (!session) {
    renderSignedOut();
    return;
  }

  const email = session.user.email.toLowerCase();
  const { data: row, error: queryError } = await supabaseClient
    .from("subscribers")
    .select("*")
    .eq("email", email)
    .maybeSingle();

  if (queryError) {
    renderError("Signed in, but couldn't load your subscription: " + queryError.message);
    return;
  }

  renderAccount(session, row);
}

init();
</script>
</body>
</html>
