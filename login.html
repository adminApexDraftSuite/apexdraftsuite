<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In | Apex Draft Suite</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .wrap { width: min(440px, 92%); padding: 24px 0; }
  .wrap .eyebrow { justify-content: center; }
  .wrap .eyebrow::before { display: none; }
  .wrap h1 { text-align: center; font-size: clamp(1.7rem, 5vw, 2.3rem); margin: 0 0 10px; }
  .wrap p.sub { text-align: center; color: var(--muted); margin: 0 0 28px; line-height: 1.6; }
  .panel {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    padding: 28px;
    box-shadow: 0 24px 60px -24px rgba(0,0,0,.6);
  }
  label { display: block; font-size: .75rem; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
  input {
    width: 100%; padding: 13px; border-radius: 8px; border: 1px solid var(--border-2);
    background: var(--ground); color: var(--ink); font-family: inherit; font-size: 1rem;
  }
  .submit { display: block; width: 100%; margin-top: 16px; }
  .submit:disabled { opacity: .55; cursor: default; }
  .notice { display: none; }
  .notice.show { display: block; }
  .back { display: block; text-align: center; margin-top: 22px; color: var(--accent); text-decoration: none; font-size: .85rem; }
  .back:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Apex Draft Suite</p>
  <h1>Sign in</h1>
  <p class="sub">Enter the email you purchased with. We'll send a one-time link — no password needed.</p>
  <div class="panel">
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email" placeholder="you@example.com" />
      <button class="btn btn-primary submit" id="submitBtn" type="submit">Send sign-in link</button>
    </form>
    <div id="notice" class="notice"></div>
  </div>
  <a class="back" href="/index.html">&larr; Back to Apex Draft Suite</a>
</div>

<script>
// Supabase project for Apex Draft Suite's subscriber/tier system. The publishable
// key is safe to expose client-side by design (RLS on the subscribers table
// restricts a signed-in user to their own row — see Build Log 2026-09-04).
const supabaseClient = supabase.createClient(
  "https://eeinccayoscirvyifwul.supabase.co",
  "sb_publishable_EJWPZYQaku9kNdTBqkpL2Q_Kk1hpUkk"
);

const form = document.getElementById("loginForm");
const notice = document.getElementById("notice");
const submitBtn = document.getElementById("submitBtn");

function showNotice(message, isError) {
  notice.textContent = message;
  notice.className = "notice show" + (isError ? " error" : "");
  notice.style.borderLeft = "3px solid " + (isError ? "var(--fade)" : "var(--accent)");
  notice.style.background = isError ? "rgba(251,100,116,.08)" : "rgba(255,138,61,.07)";
  notice.style.padding = "14px 16px";
  notice.style.marginTop = "18px";
  notice.style.color = isError ? "#f2c9c0" : "var(--muted)";
  notice.style.borderRadius = "0 8px 8px 0";
  notice.style.fontSize = "13.5px";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  if (!email) return;

  submitBtn.disabled = true;
  submitBtn.textContent = "Sending...";

  const { error } = await supabaseClient.auth.signInWithOtp({
    email,
    options: {
      emailRedirectTo: "https://apexdraftsuite.com/account.html",
    },
  });

  submitBtn.disabled = false;
  submitBtn.textContent = "Send sign-in link";

  if (error) {
    showNotice("Couldn't send the link: " + error.message, true);
    return;
  }

  showNotice("Check " + email + " for a sign-in link. It expires shortly, so use it soon.", false);
  form.reset();
});
</script>
</body>
</html>
